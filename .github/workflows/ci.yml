name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate content
        run: npm run validate
      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://aitoolkobo.pages.dev
          ASTRO_TELEMETRY_DISABLED: "1"
      - name: Check links
        run: npm run check:links
